- code: INVALID_SUBJECT
  status: 400
  meaning: subject is not pdps or images.
  area: exports
  operations: [createExport]
- code: INVALID_FILTER
  status: 400
  meaning: The request contains an unknown filter key.
  area: exports
  operations: [createExport]
- code: INVALID_TIMESTAMP
  status: 400
  meaning: last_refreshed_after is not a valid RFC 3339 timestamp.
  area: exports
  operations: [createExport]
- code: INVALID_RETAILER_REGION
  status: 400
  meaning: retailer_region is not in the configured set.
  area: exports
  operations: [createExport]
- code: PORTFOLIO_NOT_FOUND
  status: 404
  meaning: portfolio_id does not belong to the caller's organization. 404 rather than 403
