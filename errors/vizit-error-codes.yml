- code: SCRAPE_TIMEOUT
  status: 504
  meaning: Retailer scrape timed out after retries.
  area: product-details
  operations: [upsertPdpByAsin]
- code: EMPTY_IMAGE
  status: 400
  meaning: The downloaded image body was empty.
  area: images
  operations: [scoreImage]
