  area: exports
  operations: [createExport]
- code: EXPORT_CONCURRENCY_LIMIT
  status: 409
  meaning: The caller already has an export in PROCESSING. One in-flight export per organization.
  area: exports
  operations: [createExport]
- code: EXPORT_NOT_FOUND
  status: 404
  meaning: The export does not exist in the caller's organization.
  area: exports
  operations: [getExport, downloadExport]
- code: EXPORT_NOT_READY
  status: 404
  meaning: The export exists but status is still PROCESSING.
  area: exports
  operations: [downloadExport]
- code: EXPORT_EXPIRED
  status: 404
  meaning: The artifact has been purged past its 7-day retention.
  area: exports
  operations: [getExport, downloadExport]
- code: EXPORT_FAILED
  status: 200
  meaning: The export worker hit an unrecoverable failure; reported on the job record with
    status ERROR.
  area: exports
  operations: [getExport]
client_guidance:
- Branch on the error code, never on the message.
- Retry 429 and 5xx responses with exponential backoff (start around 5s, double each retry,
  cap around 60s).
- Do not retry other 4xx responses until the request has been fixed.
- When contacting support, include request_id and the UTC time of the request.
- Error codes are part of the /v1/* contract; new codes may be added over time.
