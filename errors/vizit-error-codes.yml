  status: 400
  meaning: The image has no product_category_id assigned.
  area: spark
  operations: [createSparkIdea, createSparkImagesBatch]
- code: IDEA_NOT_FOUND
  status: 404
  meaning: The Spark Idea does not exist or is not linked to this image.
  area: spark
  operations: [getSparkIdea]
- code: SQS_ENQUEUE_FAILED
  status: 500
  meaning: Failed to enqueue the request for processing; the record is marked ERROR before
