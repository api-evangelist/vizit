method: searched
source: https://docs.vizit.com/standards/errors
docs: https://docs.vizit.com/standards/errors
format: proprietary-json
format_note: 'Vizit does not use RFC 9457 application/problem+json. Every non-2xx response
  from a protected /v1/* endpoint returns a flat application/json object. Two envelope
  shapes are published: the standards page documents code/message/status/request_id/docs_url/details,
  while the per-operation reference documents detail/status_code/error_code/request_id/extra/timestamp.
  Both are transcribed below exactly as published — the divergence is the provider''s, not ours.'
envelopes:
- name: standards-page envelope
  source: https://docs.vizit.com/standards/errors
  fields:
  - {field: code, type: string, required: true, description: 'Stable, documented, SCREAMING_SNAKE_CASE
      machine-readable error code. Branch on this field, not on message.'}
  - {field: message, type: string, required: true, description: Human-readable explanation,
      safe to display to end users. May be reworded between releases.}
  - {field: status, type: integer, required: true, description: Mirrors the HTTP status code.}
  - {field: request_id, type: string (ULID), required: true, description: Unique request
      identifier, also returned in the X-Request-Id response header.}
  - {field: docs_url, type: string, required: false, description: Deep link to the relevant
      error code in the public docs.}
  - {field: details, type: array<object>, required: false, description: 'Present for 422
      validation errors and any response with multiple sub-issues; each element is {field,
      issue}.'}
- name: operation-reference envelope
  source: https://docs.vizit.com/api
  fields:
  - {field: detail, type: string, description: Human-readable error message.}
  - {field: status_code, type: integer, description: HTTP status code.}
  - {field: error_code, type: string, description: Stable machine-readable error code.}
  - {field: request_id, type: string, description: Request identifier for correlation.}
  - {field: extra, type: object, description: 'Endpoint-specific additional context. For
      example IMAGE_DOWNLOAD_FAILED populates extra.failed_urls with per-URL failure
      reasons so clients can triage bulk submissions.'}
  - {field: timestamp, type: string}
headers:
- header: X-Request-Id
  when: always
  description: Request identifier for this response. If the client sends one on the request
    it is echoed back; otherwise Vizit generates one.
- header: Retry-After
  when: 429 and sometimes 503
  description: Number of seconds to wait before retrying.
status_codes:
- {status: 200, meaning: OK, description: The request succeeded.}
- {status: 202, meaning: Accepted, description: The request was accepted for asynchronous
    processing.}
- {status: 400, meaning: Bad Request, description: The request was malformed or failed a
    request-level rule.}
- {status: 401, meaning: Unauthorized, description: The request did not include valid
    authentication credentials.}
- {status: 403, meaning: Forbidden, description: The caller is authenticated but not permitted
    to perform the operation.}
- {status: 404, meaning: Not Found, description: The resource does not exist or is not
    visible to this caller.}
- {status: 409, meaning: Conflict, description: The request conflicts with the current state
    of the resource.}
- {status: 413, meaning: Payload Too Large, description: 'Documented on upsertPdpById: more
    than 20 carousel images.'}
- {status: 422, meaning: Unprocessable Entity, description: The request failed schema or
    field-level validation.}
- {status: 429, meaning: Too Many Requests, description: The caller exceeded the rate limit.}
- {status: 500, meaning: Internal Server Error, description: An unexpected server-side error
    occurred.}
- {status: 502, meaning: Bad Gateway, description: A dependency returned an invalid response.}
- {status: 503, meaning: Service Unavailable, description: The API is temporarily unavailable.}
- {status: 504, meaning: Gateway Timeout, description: A dependency did not respond in time.}
error_codes:
- code: INVALID_REQUEST
  status: 400
  meaning: The request could not be processed.
  area: shared
- code: VALIDATION_ERROR
  status: 422
  meaning: Request body or field-level validation failed; details carries per-field issues.
  area: shared
- code: INVALID_ID
  status: 400
  meaning: id is empty or longer than 512 characters.
  area: product-details
  operations: [getPdpById, upsertPdpById]
- code: INVALID_RETAILER
  status: 400
  meaning: retailer is not in retailer_regions.
  area: product-details
  operations: [getPdpById, upsertPdpById, listProductCategories]
- code: NO_DEFAULT_PORTFOLIO
  status: 400
  meaning: The organization has no default portfolio.
  area: product-details
  operations: [upsertPdpById, scoreImage]
- code: CATEGORY_NOT_FOUND
  status: 400
  meaning: The supplied product_category_id does not exist or is outside the organization's ICP.
  area: product-details
  operations: [upsertPdpById]
- code: EXTERNAL_CATEGORY_UNMAPPED
  status: 400
  meaning: The supplied external_category_id could not be mapped to a Vizit category.
  area: product-details
  operations: [upsertPdpById]
- code: CATEGORY_UNRESOLVED
  status: 400
  meaning: No category was supplied and none could be inferred from gtin, asin, or name.
