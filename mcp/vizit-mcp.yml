  source_operation: PUT /v1/pdps/id/{id}#upsertPdpById
- name: getPdpById
  description: Retrieve the current scores and processing state for a PDP submitted by id.
  source_operation: GET /v1/pdps/id/{id}#getPdpById
- name: upsertPdpByAsin
  description: Submit or refresh a Product Detail Page by Amazon ASIN, running Vizit's scrape-and-score
