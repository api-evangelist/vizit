description: 'Vizit separates test and live access by environment host rather than by key
  prefix. Five development environments (dev1-dev5) sit alongside production, and
  credentials are environment-specific. No public self-service sandbox, no shared test
  credentials and no magic test values are published — Vizit provisions credentials per
  organization and per environment during onboarding.'
