  caching_guidance: Cache the token until it expires rather than requesting one per API call.
  refresh_guidance: On a 401, request a fresh token and retry once.
  unauthenticated_endpoints:
  - POST /auth/token
credentials:
  issuance: Provisioned by Vizit per organization and per environment during onboarding.
  self_service: false
  environment_scoped: true
  environment_note: Production credentials work only against production; dev1 credentials
    only against dev1.
  handling_guidance:
  - Store client_secret only in secure server-side systems or a secrets manager.
  - Do not embed machine-to-machine credentials in browser apps, mobile apps, or any
    distributed client.
  - Treat client_secret as a long-lived secret and the access token as a short-lived credential.
