aid: vizit
name: Vizit
description: 'Vizit (Vizit Labs, Inc.) is a Boston-based Visual AI company whose platform
  predicts, measures, optimizes and monitors the effectiveness of ecommerce visual content.
  Its patented Audience Lens technology decomposes every image into thousands of visual
  components and scores it against deep-learning models trained to simulate the visual
  preferences of specific consumer audiences, so brands can tell which hero and carousel
  images will convert on the digital shelf. The Vizit Public API is a machine-to-machine
  REST API at ext.vizit.com that lets partners and brands ingest Product Detail Pages
  by Amazon ASIN or by their own product identifiers, submit standalone images for
  scoring, retrieve listing and image scores (including GS1 hero sub-scores and the
  agent-ready / mobile-ready shopper-clarity flags), request Spark Ideas and Spark
  Images generative variations, and queue bulk CSV exports of an organization''s
  PDP and image scores.'
